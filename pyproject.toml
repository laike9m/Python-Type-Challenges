[project]
name = "Python-Type-Challenges"
version = "1.0"
description = ""
authors = [{ name = "laike9m", email = "laike9m@gmail.com" }]
dependencies = [
  "flask>=3.0.0",
  "pyright>=1.1.338",
  "flask-sitemapper>=1.7.0",
  "markdown>=3.5.1",
  "flask-htmx>=0.3.2",
  "gunicorn>=26.1.0",
]
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = { text = "MIT" }

[tool.pdm]
distribution = false  # Don't install itself.
plugins = ["pdm-autoexport"]

[tool.pdm.scripts]
dev = "flask --app app run --debug"
prod = "gunicorn -k gthread -w 2 --threads 4 --timeout 15 -b 0.0.0.0:{args:5000} app:app"
test = "pytest -n auto"
run_ruff = "ruff format"
djhtml.cmd = "djhtml --tabwidth 2 templates"
djhtml.env = { PYTHONUTF8 = "1" }
format = { composite = ["run_ruff", "djhtml"] }

[tool.pdm.dev-dependencies]
dev = [
  "pytest>=7.4.3",
  "djhtml>=3.0.6",
  "pre-commit>=3.5.0",
  "pytest-xdist>=3.3.1",
  "ruff>=0.1.14",
]

[[tool.pdm.autoexport]]
filename = "requirements.txt"
groups = ["default"]
without-hashes = true

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
